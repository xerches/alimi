name: policies
on:
  push:
    paths: ["policies/**", ".github/workflows/policies.yml"]
  pull_request:
    paths: ["policies/**", ".github/workflows/policies.yml"]
jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: pip install pyyaml pytest
      - run: python policies/build/coverage.py --check
      - run: pytest policies
      - run: python policies/build/build.py --fill "Example Co" --pack --docx-only --out /tmp/policy-build
