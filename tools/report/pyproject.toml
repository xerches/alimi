[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alimi-report"
version = "0.1.0"
description = "Turns Alimi scanner findings into an insurer-ready HTML and PDF report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "alimi-scanner>=0.2",
  "typer>=0.12",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "rich>=13.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8.0"]

[project.scripts]
alimi-report = "alimi_report.cli:app"

[tool.setuptools.packages.find]
include = ["alimi_report*"]

[tool.setuptools.package-data]
alimi_report = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
