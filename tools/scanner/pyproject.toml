[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alimi-scanner"
version = "0.2.0"
description = "Read-only security checks for Microsoft 365 and Google Workspace, with an insurer-ready findings schema."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "msal>=1.28",
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "google-auth-httplib2>=0.2",
  "dnspython>=2.6",
  "python-dotenv>=1.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alimi-scan = "alimi_scanner.cli:app"

[tool.setuptools.packages.find]
include = ["alimi_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
