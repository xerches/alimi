# Alimi brand tokens: the single source of truth for name, voice, colors and type.
# The site generates its CSS custom properties from `colors` (one --color-<key> per entry,
# underscores become hyphens), and the report package reads the same keys. Change a value here
# and every page and report follows; never type a hex value into a component.
# Status: working name, formal checks pending (MA entity search, USPTO, .com).

name: Alimi
display_name: Alimi
tagline: Security that insurers, customers and auditors accept.
tagline_alt: Security for companies too small for a security team.
founder: Alex Dennis
location: Boston, MA
domain: TODO
contact_email: TODO
site_url: https://alimibeta.netlify.app   # beta host until the domain exists
demo_url: https://alimi-demo.netlify.app  # the product demo; linked from the site as "See the product" since Nov 2, 2026 (founder's decision), noindex kept until the hosted app exists

voice:
  - Plain English a business owner understands.
  - Define a term the first time it appears (MFA, EDR, BEC).
  - No fear, no hooded hackers, no "cyber" clichés.
  - Say what it costs and what happens next.

# Palette: "indigo and ink", chosen Nov 2, 2026 after the founder asked for "some blue or purple,
# something that stands out in a lightweight way" (it replaces the brick-and-slate palette of
# Nov 1). Primary is a deep indigo: it reads as blue-violet, carries well on white without shouting,
# and is rare enough among security vendors (who favour navy and teal) to stand out. Pages stay white
# with a faintly lavender cool gray for alternate sections; header, footer and dark bands are a
# deep indigo ink; links and buttons on dark surfaces are a pale periwinkle. Amber stays as the
# small accent on dark surfaces only. Every text pairing below meets WCAG AA (4.5:1) on the surface
# it is meant for (site/tests/contrast.test.mjs proves it); the light theme is the default and the
# *_on_dark / *_inverse / *_dark tokens serve the dark bands.
#
# Two themes since Nov 3, 2026 (founder: "dark theme as an option"): `colors` is the light theme and
# the default; `colors_dark` lists the same keys for the dark theme, which the site applies when the
# visitor's device asks for it or when the visitor picks it with the toggle in the top bar. The two
# maps must have the same keys in the same order (site/src/lib/theme.js checks), and every pairing
# the contrast test proves is proved on both. Dark bands keep their own tokens in both themes, so
# the ink strip, the footer and the count block stay a step darker than the page around them.
colors:
  # Brand
  primary: "#4338CA"            # indigo: buttons, links, brand marks on light surfaces (7.9:1 on white)
  primary_hover: "#3730A3"
  primary_active: "#2E2A86"
  primary_soft: "#EEF0FD"       # tinted panel behind callouts and badges on light surfaces
  primary_contrast: "#FFFFFF"   # the label on a primary button or counter (white on indigo here, ink on periwinkle in the dark theme)
  primary_on_dark: "#A5B4FC"    # periwinkle: links and buttons on dark bands (7.7:1 on secondary)
  primary_on_dark_hover: "#C7D2FE"
  primary_on_dark_contrast: "#14181F"  # the label on a periwinkle button, in both themes
  secondary: "#1E2340"          # indigo ink: header, footer, dark sections
  secondary_soft: "#E6E8F4"     # light tint of the ink for quiet panels
  accent: "#F0B86B"             # amber: focus rings and small marks on dark surfaces, never body text
  accent_deep: "#A8761D"        # amber for decoration on light surfaces (3:1, large or non-text only)

  # Backgrounds and surfaces
  background: "#FFFFFF"         # page
  background_alt: "#F5F6FB"     # alternate sections and the app canvas, cool gray with a hint of lavender
  background_dark: "#151833"    # deepest ink band (footer)
  surface: "#FFFFFF"            # cards and panels on light surfaces
  surface_dark: "#2B3159"       # cards on dark bands

  # Text
  text: "#14181F"               # ink
  text_secondary: "#3C4552"
  text_muted: "#5B6573"         # 5.6:1 on white, 5.1:1 on background_alt
  text_inverse: "#FFFFFF"       # on secondary and background_dark
  text_inverse_muted: "#B7BCD6"

  # Borders and dividers
  border: "#DDE1E6"             # hairlines and card edges (decorative)
  border_strong: "#6F7A88"      # form fields and controls that need a 3:1 edge
  border_dark: "#3A4170"        # dividers on dark bands

  # Semantic feedback (text colors; *_soft are their tinted backgrounds)
  success: "#1F6B43"
  success_soft: "#E3F1E8"
  warning: "#8A5A00"
  warning_soft: "#FBF0D9"
  danger: "#B01E2B"             # crimson, so an error never looks like the brand
  danger_soft: "#F9E3E4"
  info: "#2A5F7F"
  info_soft: "#E3EEF4"

  # Interactive states
  focus_ring: "#4338CA"         # on light surfaces
  focus_ring_on_dark: "#F0B86B"

# The dark theme: the same indigo and ink, inverted. The page is deep ink, cards a step lighter,
# the strip and the footer a step darker than the page, periwinkle for links and primary buttons
# (so a primary button's label is ink, through primary_contrast), the feedback colors lifted so they
# read on dark tints. Same keys as `colors`, same order.
colors_dark:
  # Brand
  primary: "#A5B4FC"            # periwinkle: links, buttons and marks on the dark page
  primary_hover: "#C7D2FE"
  primary_active: "#E0E7FF"
  primary_soft: "#23285A"       # tinted panel behind callouts, badges and the readiness bar
  primary_contrast: "#0E1126"   # ink on periwinkle
  primary_on_dark: "#A5B4FC"
  primary_on_dark_hover: "#C7D2FE"
  primary_on_dark_contrast: "#0E1126"
  secondary: "#232A5C"          # the dark bands and the count block: a lighter indigo than the page, so they still read as bands
  secondary_soft: "#23285A"     # quiet panels, badges and tags
  accent: "#F0B86B"
  accent_deep: "#F2CC7C"        # amber decoration, now on dark surfaces

  # Backgrounds and surfaces
  background: "#0E1126"         # page
  background_alt: "#0E1126"     # the canvas; alternate sections use surface, one step lighter
  background_dark: "#07091A"    # the strip and the footer, a step darker than the page
  surface: "#171B38"            # cards and panels
  surface_dark: "#2F3773"       # cards and the active item on dark bands

  # Text
  text: "#E9EBF7"
  text_secondary: "#C5CAE3"
  text_muted: "#A6ACC8"         # 7.5:1 on surface
  text_inverse: "#FFFFFF"
  text_inverse_muted: "#AEB4D0"

  # Borders and dividers
  border: "#2A3060"             # hairlines and card edges
  border_strong: "#7B86B3"      # form fields and controls, 3:1 on surface
  border_dark: "#3A4170"        # dividers on dark bands

  # Semantic feedback
  success: "#8BD9AC"
  success_soft: "#163A28"
  warning: "#F2CC7C"
  warning_soft: "#3D300F"
  danger: "#F7A3AB"
  danger_soft: "#4A1A21"
  info: "#9CC9E6"
  info_soft: "#16304A"

  # Interactive states
  focus_ring: "#A5B4FC"
  focus_ring_on_dark: "#F0B86B"

typography:
  heading: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  body: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"

