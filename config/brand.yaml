# alimi brand tokens: the single source of truth for name, voice, colors and type.
# The site generates its CSS custom properties from `colors` (one --color-<key> per entry,
# underscores become hyphens), and the report package reads the same keys. Change a value here
# and every page and report follows; never type a hex value into a component.
# Status: working name, formal checks pending (MA entity search, USPTO, .com).

name: alimi
display_name: alimi
tagline: Security that insurers, customers and auditors accept.
tagline_alt: Security for companies too small for a security team.
founder: Alex Dennis
location: Boston, MA
domain: TODO
contact_email: TODO
site_url: https://alimibeta.netlify.app   # beta host until the domain exists

voice:
  - Plain English a business owner understands.
  - Define a term the first time it appears (MFA, EDR, BEC).
  - No fear, no hooded hackers, no "cyber" clichés.
  - Say what it costs and what happens next.

# Palette decided Nov 1, 2026 (research in docs/decisions.md). Primary is "Boston brick", a deep
# brick red-orange: warm and human for an owner, premium rather than alarming, almost unused in
# security, and it says Boston without a map. The deep teal-slate of the earlier Caprius site
# stays as the secondary for header, footer and dark bands. Gold is a small accent only.
# Every text pairing below meets WCAG AA (4.5:1) on the surface it is meant for; the light
# theme is the default and the *_on_dark / *_inverse / *_dark tokens serve the dark bands.
colors:
  # Brand
  primary: "#9A3B1E"            # brick: buttons, links, brand marks on light surfaces (6.5:1 on background)
  primary_hover: "#7E2F16"
  primary_active: "#66250F"
  primary_soft: "#F6E7E0"       # tinted panel behind callouts and badges on light surfaces
  primary_on_dark: "#E8906E"    # clay: links and buttons on dark bands (7.3:1 on background_dark)
  primary_on_dark_hover: "#F0A98C"
  secondary: "#15302E"          # deep teal-slate: header, footer, dark sections
  secondary_soft: "#E4ECEA"     # light tint of the secondary for quiet panels
  accent: "#E0B04A"             # gold: focus rings and small marks on dark surfaces, never body text
  accent_deep: "#B8871F"        # gold for decoration on light surfaces (3:1, large or non-text only)

  # Backgrounds and surfaces
  background: "#FAF7F1"         # page, warm off-white
  background_alt: "#F1EBE0"     # alternate sections, sand
  background_dark: "#141A1A"    # ink band (footer)
  surface: "#FFFFFF"            # cards and panels on light surfaces
  surface_dark: "#1D2626"       # cards on dark bands

  # Text
  text: "#1B1F22"               # ink
  text_secondary: "#444D4D"
  text_muted: "#5F6B6B"         # 5.2:1 on background, 4.7:1 on background_alt
  text_inverse: "#FAF7F1"       # on secondary and background_dark
  text_inverse_muted: "#B7C0BE"

  # Borders and dividers
  border: "#D9D0C1"             # hairlines and card edges (decorative)
  border_strong: "#7C8686"      # form fields and controls that need a 3:1 edge
  border_dark: "#2C4745"        # dividers on dark bands

  # Semantic feedback (text colors; *_soft are their tinted backgrounds)
  success: "#1F6B43"
  success_soft: "#E3F1E8"
  warning: "#8A5A00"
  warning_soft: "#FBF0D9"
  danger: "#B01E2B"             # a cooler crimson than the brick, so an error never looks like the brand
  danger_soft: "#F9E3E4"
  info: "#2A5F7F"
  info_soft: "#E3EEF4"

  # Interactive states
  focus_ring: "#9A3B1E"         # on light surfaces
  focus_ring_on_dark: "#E0B04A"

typography:
  heading: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  body: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"

social:
  linkedin: TODO
  github: https://github.com/xerches/alimi
