# The framework catalog: what a customer can pick as the included framework or add as an add-on.
# Added Nov 2, 2026 at the founder's request ("include all frameworks: HIPAA, PCI DSS, GDPR etc.") and
# widened the same evening to everything Vanta and Drata list ("include all frameworks below to my page").
# Only IDs, names and Alimi's own one-line summaries live here; the standards' text is copyrighted
# and is never copied in (CLAUDE.md). `mapped: true` means the policy library and the control catalog
# already carry requirement IDs for it (policies/requirements.yaml); the rest get their requirement
# lists in prompt 14. `audience` is who usually needs it, in the buyer's words. `category` groups the
# catalog on the site (security, privacy, ai, government, financial, industry; the list and its order
# live in site/src/lib/config.js). `always_included: true` marks Alimi's own posture score: in every
# plan, outside the framework count and the add-on price.
# The site reads this file for the frameworks pages and the pricing calculator; the platform loads it
# as the Framework table; the demo lists it on the Frameworks page. The number of frameworks is the one
# figure the site is allowed to print (founder's rule, Nov 2, 2026: no scalable counts on the site).

frameworks:
  - id: alimi_posture
    name: Alimi Recommended Security Posture Score
    short: Posture score
    category: security
    summary: Alimi's own scored set of controls that go beyond what any standard asks, in the spirit of Microsoft Secure Score; compliance is not security, and this is where the gap shows.
    audience: Every customer; it is in every plan and does not count toward the framework total
    mapped: true
    always_included: true   # added Nov 2, 2026 at the founder's request; not accredited, never an add-on

  # ---------- Security ----------
  - id: insurer
    name: Cyber insurance questionnaire
    short: Insurer
    category: security
    summary: The questions every carrier asks at renewal, answered from your own tenant and evidence.
    audience: Every company with a cyber policy or a renewal coming
    mapped: true
  - id: soc2
    name: SOC 2 (Trust Services Criteria)
    short: SOC 2
    category: security
    summary: The report a software or service company's customers ask for before they sign.
    audience: Companies that sell to other businesses
    mapped: true
  - id: iso27001
    name: ISO/IEC 27001:2022
    short: ISO 27001
    category: security
    summary: The international certificate for an information security management system.
    audience: Companies with customers in Europe or in regulated industries
    mapped: true
  - id: iso27017
    name: ISO/IEC 27017
    short: ISO 27017
    category: security
    summary: The cloud-specific additions to ISO 27001, for providers and customers of cloud services.
    audience: Cloud service providers that already hold or pursue ISO 27001
    mapped: false
  - id: pci_dss
    name: PCI DSS v4.0.1
    short: PCI DSS
    category: security
    summary: The card brands' requirements for anyone who stores, processes or transmits card data.
    audience: Companies that take card payments, from SAQ A upward
    mapped: false
  - id: hitrust
    name: HITRUST CSF (e1, i1, r2)
    short: HITRUST
    category: security
    summary: The healthcare industry's certifiable framework, in three sizes, that hospital systems and health plans ask their vendors for.
    audience: Vendors to hospital systems, health plans and large healthcare companies
    mapped: false
  - id: nist_csf
    name: NIST Cybersecurity Framework 2.0
    short: NIST CSF
    category: security
    summary: The maturity picture a board, a bank or a parent company asks for.
