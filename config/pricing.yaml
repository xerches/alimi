# alimi pricing. Single source of truth: the site, proposals and CLAUDE.md read from here.
# One product: the alimi platform, priced per company by size, with fixed-fee services around it and
# free resources in front of it. The platform tiers were set on Nov 1, 2026 by the founder's rule
# (average of comparable vendors' published prices, minus 5 to 15%); the comparables and the arithmetic
# are in docs/research/platform-pricing.md. Raise after three case studies.
# Prices in USD. "list" is what the site shows; "range" is what we quote for a fixed-fee service.

currency: USD
updated: 2026-11-01

products:
  platform:
    name: alimi platform
    tagline: Continuous security and compliance for companies too small for a security team.
    billing: Billed yearly in advance; the monthly figure is the yearly price divided by twelve.
    audit_note: CPA audit fees are separate, as with every platform on the market.
    included_everywhere:
      - The full policy library, 23 policies with staff acknowledgement tracking
      - Read-only integrations; alimi never holds a password
      - An owner, a status, tasks and reminders for every control
      - A named compliance lead for the scoping and policy calls software leaves to you
    tiers:
      - id: starter
        type: product
        name: Starter
        list: 3900
        people_up_to: 25
        frameworks: [insurer]
        integrations: 1
        rule: "Small-company floor: SecureSlate $2,688, TrustCloud $5,000, Trustero $5,000, Screenata $5,988; average $4,669, minus 15%"
        includes:
          - The cyber insurance questionnaire as the first framework
          - One workspace integration (Microsoft 365 or Google Workspace), scanned weekly
          - Controls with automated tests, evidence with renewal dates
          - People, training records and onboarding checklists
          - A public trust page
      - id: growth
        type: product
        name: Growth
        list: 7900
        people_up_to: 100
        frameworks: [insurer, soc2, iso27001]
        integrations: 3
        rule: "Thirteen published entry tiers (Vanta, Drata, Secureframe, Sprinto, Scytale, Thoropass, Carbide, Iru, Delve, Scrut, TrustCloud, Trustero, Screenata) average $9,361; minus 15%"
        includes:
          - Everything in Starter
          - SOC 2 and ISO 27001 readiness, mapped by criterion ID
          - Vendor inventory and reviews, risk register
          - Security questionnaires drafted from the program's own data
          - Three integrations
      - id: scale
        type: product
        name: Scale
        list: 15700
        people_up_to: 200
        frameworks: [insurer, soc2, iso27001, hipaa, iso42001]
        integrations: null   # unlimited
        rule: "Ten published mid tiers (Vanta Plus and Professional, Drata Advanced, Secureframe median, Carbide Advanced and Insights, Strike Graph Scale, Scrut, Trustero mid-market, Iru) average $18,550; minus 15%"
        includes:
          - Everything in Growth
          - HIPAA and ISO 42001 (AI governance) frameworks
          - Auditor and broker access with an export pack
          - Unlimited integrations and API access
          - Multi-tenant view for resellers

  services:
    name: Services
    tagline: Fixed fees, delivered by the founder, around the platform.
    tiers:
      - id: assessment
        type: service
        name: Security assessment and insurer report
        range: [500, 1500]
        includes:
          - Read-only scan of Microsoft 365 or Google Workspace under a signed letter
          - Every finding with evidence and a plain-English fix
          - Evidence pack checklist for the broker and a 30-minute debrief
          - Credited against the first year of the platform
      - id: insurance_ready_30
        type: service
        name: Insurance-ready in 30 days
        range: [4000, 8000]
        includes:
          - Fix every finding from the assessment
          - MFA, admin, forwarding and sharing hardening
          - One incident response tabletop
          - Evidence pack delivered to the broker from the platform
      - id: policy_adoption
        type: service
        name: Policy adoption workshop
        range: [1500, 3000]
        includes:
          - Half-day session to tailor, approve and roll out the policy library
          - Staff acknowledgement tracking set up in the platform
      - id: fraud_workshop
        type: service
        name: Payment fraud workshop and yearly drill
        range: [1500, 3000]
        includes:
          - Half-day workshop for the finance team or closing office
          - Verification procedure tailored to the firm
          - One drill per year
      - id: ai_policy_implementation
        type: service
        name: AI policy implementation
        range: [2500, 5000]
        includes:
          - Policy adoption with leadership
          - Access rules set in Microsoft 365 or Google Workspace
          - 45-minute staff training
          - ISO 42001 gap check for companies that need it

  free:
    name: Free resources
    tagline: Start with these. No card, no account.
    tiers:
      - id: scan_summary
        type: product
        name: One-page security scan summary
        list: 0
        includes:
          - Overall score
          - Pass or fail against the questions insurers ask
      - id: fraud_procedure
        type: product
        name: Payment fraud procedure
        list: 0
        includes:
          - Payment-change and wire verification procedure
          - Callback scripts for finance staff
          - One-page staff poster
          - Closing-day checklist for home buyers and sellers
      - id: core_policies
        type: product
        name: Three core policies
        list: 0
        includes:
          - Information security policy
          - Acceptable use policy
          - Incident response policy
      - id: ai_policy
        type: product
        name: AI acceptable use policy
        list: 0
        includes:
          - AI acceptable use policy
          - Mapped to ISO 42001 and the insurer's AI questions

retainers:
  fractional_security_lead:
    name: Fractional security and compliance lead
    range_per_month: [3000, 6000]
    hours_per_month: [10, 20]

terms:
  minimum_monthly_retainer: 1500
  payment: "Monthly in advance by card or ACH"

# Channel: resellers and referrers. Tiers set by the founder Nov 1, 2026. Discounts apply to platform
# list prices and to the low end of service ranges.
partners:
  principle: alimi never sells direct to a reseller's client for less than the reseller pays.
  reseller:
    who: MSPs, IT consultancies, vCISO firms
    buys_at: list price minus the tier discount; the reseller sets its own client price
    tiers:   # changed Nov 1, 2026 at the founder's request (was 1-5/20%, 6-20/30%, 21+/40%)
      - id: starter
        active_clients: [1, 50]
        discount: 0.10
      - id: growth
        active_clients: [51, 150]
        discount: 0.15
      - id: scale
        active_clients: [151, null]
        discount: 0.20
    includes:
      - White-label option on reports, policy packs and the trust page (reseller logo, "powered by alimi" line)
      - Not-for-resale licence for the reseller's own tenant
      - Multi-tenant view in the platform (the Scale tier feature, included for resellers)
      - One 60-minute partner training session and a sales one-pager
      - Inbound leads in the reseller's area offered to them first
    billing: alimi invoices the reseller monthly; the reseller invoices its client
    review: tiers recalculated quarterly on active clients
  referral:
    who: insurance brokers, CPAs, attorneys who refer but do not resell
    fee: 0.10
    of: first-year product and service revenue from the referred client
    paid: within 30 days of alimi being paid
