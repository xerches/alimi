# Alimi pricing. Single source of truth: the site, proposals, templates and CLAUDE.md read from here.
# One product: the Alimi platform, priced per user per month in four tiers (Silver, Gold, Platinum,
# Diamond), with one framework included and more frameworks as add-ons, and fixed-fee services
# around it. Model set by the founder on Nov 2, 2026 ("pricing by user, baseline comes with 1
# framework, additional frameworks are extra per framework, 5 or more frameworks 5% off each, 10 or
# more 10% off, cap at 10"). Every number was set by the founder's rule (average of comparable vendors'
# prices for a 50-person company, minus 15%); the comparables and the arithmetic are in
# docs/research/platform-pricing.md. Raise after three case studies.
# Prices in USD. "per_user_month" is what the site shows; "range" is what we quote for a service.

currency: USD
updated: 2026-11-02

products:
  platform:
    name: Alimi platform
    tagline: Continuous security and compliance for companies too small for a security team.
    pricing_model: per_user   # every platform price is per user per month; a user is a person in the connected tenant
    minimum_users: 10         # the smallest subscription; a company of 6 pays for 10
    # Billing, set by the founder on Nov 2, 2026: every plan is paid monthly. A 12-month term is the
    # list price in twelve monthly payments; month to month costs monthly_premium more and can end
    # at any month's end. No automatic increase at renewal and the price is locked for
    # price_lock_months. The month-to-month premium is the founder's pricing rule applied to the
    # 15 to 25% typical SaaS vendors charge; confirm or change it here and the site follows.
    billing:
      term_months: 12
      monthly_premium: 0.15
      escalator: none
      price_lock_months: 24
    audit_note: CPA audit fees are separate, as with every platform on the market.
    included_everywhere:
      - The full policy library, 23 policies with staff acknowledgement tracking
      - Security awareness lessons for every user, with completion tracking and a yearly cycle
      - Read-only integrations; Alimi never holds a password
      - An owner, a status, tasks and reminders for every control
      - A named compliance lead for the scoping and policy calls software leaves to you
    # Frameworks: one of the catalog in config/frameworks.yaml is included in every tier; each
    # further framework is an add-on per user per month. The discount counts every framework on the
    # account (the included one too) and applies to the add-on price. max is the most frameworks
    # one account can hold for now.
    frameworks:
      included: 1
      addon_per_user_month: 4
      discounts:
        - { from_total: 5, discount: 0.05 }
        - { from_total: 10, discount: 0.10 }
      max: 10
      rule: "Additional-framework fees at Vanta ($5,000, $5,000, $5,000 to $15,000) and Drata ($3,000 to $10,000, $1,500 to $3,000, $5,000, $7,500) average $5,893 a year; per user at a 100-person company, minus 15%"
    tiers:
      - id: silver
        type: product
        name: Silver
        per_user_month: 13
        integrations: 1
        rule: "Eleven entry plans priced for a 50-person company (Vanta Essentials, Drata Foundation, Secureframe, Sprinto, Scytale, Thoropass, Carbide, Iru, TrustCloud, Trustero, Screenata) average $14.95 per user a month; minus 15%"
        summary: The insurer-ready baseline for a company that has to answer one questionnaire this year.
        includes:
          - One framework of your choice; most companies start with the cyber insurance questionnaire
          - One workspace integration (Microsoft 365 or Google Workspace), scanned weekly
          - Controls with automated tests, evidence with renewal dates
          - People, training and onboarding checklists
          - A public trust page
          - Email support and a quarterly call with your compliance lead
      - id: gold
        type: product
        name: Gold
        per_user_month: 25
        integrations: 3
        rule: "Nine multi-framework mid tiers priced for a 50-person company (Vanta Plus, Drata Advanced, Secureframe median, Carbide Advanced and Insights, Strike Graph Scale, Scrut, Trustero mid-market, Iru Compliance Automation) average $29.26 per user a month; minus 15%"
        summary: For a company whose customers ask for SOC 2 or ISO 27001 and whose vendors need watching.
        includes:
          - Everything in Silver
          - Vendor inventory and reviews, risk register
          - Security questionnaires drafted from your own evidence
          - Auditor and broker access with an export pack
          - Three integrations
          - A monthly call with your compliance lead
      - id: platinum
        type: product
        name: Platinum
        per_user_month: 38
        integrations: null   # unlimited
        rule: "Gold plus the add-ons the market sells separately, priced for a 100-person company: access reviews (Drata $5,000 to $12,000), custom integrations and API (Drata $5,000 to $10,000), premium support (Drata 15 to 20% of licence); $15.52 per user a month, minus 15%"
        summary: For a company with several frameworks, its own systems to connect, and an AI programme to govern.
        includes:
          - Everything in Gold
          - Unlimited integrations and API access
          - Access reviews on a schedule, with the evidence filed
          - AI governance: AI tool inventory, vendor change feed, ISO 42001 mapping
          - Custom controls and custom frameworks
          - Single sign-on and priority support
      - id: diamond
        type: product
        name: Diamond
        per_user_month: 50
        integrations: null
        rule: "Platinum plus audit coordination run by Alimi (Vanta Seamless SOC $10,000 to $25,000 a year) priced for a 100-person company: $14.58 per user a month, minus 15%"
        summary: For a company that wants Alimi to run the audit and the programme, not only the platform.
        includes:
          - Everything in Platinum
          - Alimi runs the audit with the CPA firm, from scoping to the final report
          - A dedicated compliance lead with a monthly working session
          - Quarterly board and insurer report
          - Multi-entity support and a one-business-day support response

  services:
    name: Services
    tagline: Fixed fees, delivered by the founder, around the platform.
    tiers:
      - id: assessment
        type: service
        name: Security assessment and insurer report
        range: [500, 1500]
        includes:
          - Read-only scan of Microsoft 365 or Google Workspace under a signed letter
          - Every finding with evidence and a plain-English fix
          - Evidence pack checklist for the broker and a 30-minute debrief
          - Credited against the first year of the platform
      - id: insurance_ready_30
        type: service
        name: Insurance-ready in 30 days
        range: [4000, 8000]
        includes:
          - Fix every finding from the assessment
          - MFA, admin, forwarding and sharing hardening
          - One incident response tabletop
          - Evidence pack delivered to the broker from the platform
      - id: policy_adoption
        type: service
        name: Policy adoption workshop
        range: [1500, 3000]
        includes:
          - Half-day session to tailor, approve and roll out the policy library
          - Staff acknowledgement tracking set up in the platform
      - id: fraud_workshop
        type: service
        name: Payment fraud workshop and yearly drill
        range: [1500, 3000]
        includes:
          - Half-day workshop for the finance team and anyone who approves a payment
          - Verification procedure tailored to the firm
          - One drill per year
      - id: ai_policy_implementation
        type: service
        name: AI policy implementation
        range: [2500, 5000]
        includes:
          - Policy adoption with leadership
          - Access rules set in Microsoft 365 or Google Workspace
          - 45-minute staff training
          - ISO 42001 gap check for companies that need it

retainers:
  fractional_security_lead:
    name: Fractional security and compliance lead
    range_per_month: [3000, 6000]
    hours_per_month: [10, 20]

terms:
  minimum_monthly_retainer: 1500
  payment: "Monthly in advance by card or ACH"

# Channel: resellers and referrers. Discount tiers set by the founder Nov 1, 2026; the tier names and
# the incentives were added Nov 2, 2026 at the founder's request. Discounts apply to platform list
# prices and to the low end of service ranges.
partners:
  principle: Alimi never sells direct to a reseller's client for less than the reseller pays.
  reseller:
    who: MSPs, IT consultancies, vCISO firms
    buys_at: list price minus the tier discount; the reseller sets its own client price
    tiers:   # changed Nov 1, 2026 at the founder's request (was 1-5/20%, 6-20/30%, 21+/40%)
      - id: partner
        active_clients: [1, 50]
        discount: 0.10
      - id: preferred
        active_clients: [51, 150]
        discount: 0.15
      - id: premier
        active_clients: [151, null]
        discount: 0.20
    includes:
      - White-label option on reports, policy packs and the trust page (reseller logo, "powered by Alimi" line)
      - Not-for-resale licence for the reseller's own tenant, and a demo tenant for sales calls
      - Multi-tenant view in the platform: every client's readiness, failing tests and due dates on one screen
      - Partner training with a certificate, a sales one-pager and a quarterly product briefing
      - Inbound leads in the reseller's area offered to them first
      - Second-line support from Alimi; the reseller stays the client's first call
    # Incentives beyond the discount tiers, proposed Nov 2, 2026; confirm before the first partner conversation.
    incentives:
      - id: launch
        name: Launch tier
        text: A new reseller buys at the Preferred discount for its first six months, whatever its client count
      - id: registration
        name: Deal registration
        text: A registered prospect is protected for 90 days and earns an extra 5 points of discount on that client's first year
      - id: bundle
        name: Framework margin
        text: Add-on frameworks carry the reseller's tier discount too, so a multi-framework client pays the reseller more without costing it more
      - id: services
        name: Service delivery
        text: A reseller that delivers the fixed-fee services itself keeps the whole fee; Alimi trains the delivery team once a year at no charge
    billing: Alimi invoices the reseller monthly; the reseller invoices its client
    review: tiers recalculated quarterly on active clients
  referral:
    who: insurance brokers, CPAs, attorneys who refer but do not resell
    fee: 0.10
    of: first-year product and service revenue from the referred client
    paid: within 30 days of Alimi being paid
