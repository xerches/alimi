# denimi pricing. Single source of truth: the site, proposals and CLAUDE.md read from here.
# Starting points inside the ranges from the Oct 2026 research. Raise after three case studies.
# Prices in USD. "range" is what we quote; "list" is what the site shows.

currency: USD
updated: 2026-10-31

products:
  ai_policy_kit:
    name: AI Policy Kit
    tagline: An AI acceptable use policy your staff will actually read, in 20 minutes.
    tiers:
      - id: free
        type: product
        name: Policy generator
        list: 0
        includes:
          - AI acceptable use policy (Markdown and DOCX)
          - One-page staff guide
          - AI tool inventory template
      - id: pro
        type: product
        name: Policy kit plus inventory scan
        list: 99
        range: [49, 99]
        includes:
          - Everything in free
          - Read-only scan of Microsoft 365 or Google Workspace logs for AI apps in use
          - Personal-account vs company-account breakdown
      - id: implementation
        type: service
        name: AI policy implementation
        range: [2500, 5000]
        includes:
          - Policy adoption with leadership
          - Access rules set in Microsoft 365 or Google Workspace
          - 45-minute staff training
          - ISO 42001 gap check for companies that need it

  workspace_scan:
    name: Workspace Security Scan
    tagline: The report your insurer and your customers are asking for.
    tiers:
      - id: free
        type: product
        name: One-page summary
        list: 0
        includes:
          - Overall score
          - Pass/fail against the six questions insurers ask
      - id: full_report
        type: product
        name: Full insurer-ready report
        range: [500, 1500]
        includes:
          - Every finding with evidence and plain-English fix
          - Evidence pack checklist for the broker
          - 30-minute debrief call
      - id: insurance_ready_30
        type: service
        name: Insurance-ready in 30 days
        range: [4000, 8000]
        includes:
          - Fix every finding from the report
          - MFA, admin, forwarding and sharing hardening
          - One incident response tabletop
          - Evidence pack delivered to the broker

  payment_fraud_kit:
    name: Payment Fraud Protection Kit
    tagline: Verify before you pay. A procedure, not a product pitch.
    tiers:
      - id: kit
        type: product
        name: Digital kit
        range: [149, 299]
        includes:
          - Payment-change and wire verification procedure
          - Callback scripts for finance staff
          - One-page staff poster
          - 20-minute training video
          - Closing-day checklist for home buyers and sellers
      - id: workshop
        type: service
        name: Half-day workshop and yearly drill
        range: [1500, 3000]
        includes:
          - Half-day workshop for the finance team or closing office
          - Procedure tailored to the firm
          - One drill per year

  policy_pack:
    name: Policy Pack
    tagline: The policies SOC 2, ISO 27001 and your insurer expect, written for a company your size.
    status: proposed 2026-11-01, confirm before publishing
    tiers:
      - id: free
        type: product
        name: Three core policies
        list: 0
        includes:
          - Information security policy
          - Acceptable use policy
          - Incident response policy
      - id: full
        type: product
        name: Full policy library
        range: [299, 499]
        includes:
          - Every policy in /policies, mapped to SOC 2, ISO 27001, ISO 42001 and insurer questions
          - Coverage matrix showing which requirement each policy satisfies
          - DOCX and PDF with the company name filled in
      - id: adoption
        type: service
        name: Policy adoption workshop
        range: [1500, 3000]
        includes:
          - Half-day session to tailor, approve and roll out the policies
          - Staff acknowledgement tracking set up in Microsoft 365, Google Workspace or the platform

retainers:
  fractional_security_lead:
    name: Fractional security and compliance lead
    range_per_month: [3000, 6000]
    hours_per_month: [10, 20]

terms:
  minimum_monthly_retainer: 1500
  payment: "Monthly in advance by card or ACH"
  discount_multi_product: 0.10

# Channel: resellers and referrers. Starting points proposed 2026-11-01; confirm before the first
# partner conversation. Discounts apply to list prices and to the low end of service ranges.
partners:
  principle: denimi never sells direct to a reseller's client for less than the reseller pays.
  reseller:
    who: MSPs, IT consultancies, vCISO firms
    buys_at: list price minus the tier discount; the reseller sets its own client price
    tiers:
      - id: starter
        active_clients: [1, 5]
        discount: 0.20
      - id: growth
        active_clients: [6, 20]
        discount: 0.30
      - id: scale
        active_clients: [21, null]
        discount: 0.40
    includes:
      - White-label option on the scanner report and the policy pack (reseller logo, "powered by denimi" line)
      - Not-for-resale licence for the reseller's own tenant
      - Multi-tenant view in the platform once it exists (phase 3)
      - One 60-minute partner training session and a sales one-pager
      - Inbound leads in the reseller's area offered to them first
    billing: denimi invoices the reseller monthly; the reseller invoices its client
    review: tiers recalculated quarterly on active clients
  referral:
    who: insurance brokers, CPAs, attorneys who refer but do not resell
    fee: 0.10
    of: first-year product and service revenue from the referred client
    paid: within 30 days of denimi being paid
